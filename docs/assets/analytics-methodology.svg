<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Two-tier analytics methodology</title><desc id="d">GitHub aggregate reports flow to private collection and then to owner analytics or a reviewed public projection.</desc><rect width="1000" height="430" rx="20" fill="#101827"/><g font-family="Arial,sans-serif" fill="#f1f5f9"><text x="30" y="45" font-size="27" font-weight="700">Project engagement analytics</text><text x="30" y="72" font-size="16" fill="#b6c5d7">Aggregate source · separate disclosure boundaries</text><g fill="#1b2739" stroke="#8293ad"><rect x="300" y="98" width="400" height="66" rx="12"/><rect x="300" y="196" width="400" height="66" rx="12"/><rect x="30" y="320" width="450" height="76" rx="12"/><rect x="520" y="320" width="450" height="76" rx="12"/></g><g stroke="#8293ad" stroke-width="2" fill="none"><path d="M500 164 V196 m-5 -6 l5 6 5 -6"/><path d="M500 262 V287 H255 V320 m-5 -6 l5 6 5 -6"/><path d="M500 287 H745 V320 m-5 -6 l5 6 5 -6"/></g><g text-anchor="middle"><text x="500" y="126" font-size="18" font-weight="700">GitHub Traffic API</text><text x="500" y="148" font-size="14" fill="#b6c5d7">Supported aggregate reports</text><text x="500" y="224" font-size="18" font-weight="700">Private collection</text><text x="500" y="246" font-size="14" fill="#b6c5d7">Validated historical snapshots</text><text x="255" y="348" font-size="18" font-weight="700">Owner analytics</text><text x="255" y="373" font-size="14" fill="#b6c5d7">Full supported aggregate detail</text><text x="745" y="348" font-size="18" font-weight="700">Public report — proposed</text><text x="745" y="373" font-size="14" fill="#b6c5d7">Reviewed, coarsened, suppressed as needed</text></g></g></svg>