<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img"><title>Weekly engagement reporting</title><desc>Aggregate reports are validated for complete weeks and reporting thresholds, then displayed as ranges.</desc><rect width="1000" height="250" rx="20" fill="#101827"/><g font-family="Arial,sans-serif" fill="#f1f5f9"><text x="30" y="45" font-size="27" font-weight="700">Weekly engagement reporting</text><text x="30" y="74" font-size="16" fill="#b6c5d7">Repository-level views and clones</text><rect x="30" y="102" width="300" height="90" rx="12" fill="#1b2739" stroke="#8293ad"/><text x="45" y="135" font-size="18" font-weight="700">GitHub aggregate reports</text><text x="45" y="164" font-size="15" fill="#b6c5d7">Complete UTC week</text><rect x="350" y="102" width="300" height="90" rx="12" fill="#1b2739" stroke="#8293ad"/><text x="365" y="135" font-size="18" font-weight="700">Reporting rules</text><text x="365" y="164" font-size="15" fill="#b6c5d7">Threshold and ranges</text><rect x="670" y="102" width="300" height="90" rx="12" fill="#1b2739" stroke="#8293ad"/><text x="685" y="135" font-size="18" font-weight="700">Engagement report</text><text x="685" y="164" font-size="15" fill="#b6c5d7">Weekly visual summary</text><text x="30" y="226" font-size="14" fill="#b6c5d7">Not reported does not mean zero. Ranges are not exact counts.</text></g></svg>