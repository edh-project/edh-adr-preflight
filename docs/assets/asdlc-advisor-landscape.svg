<svg xmlns="http://www.w3.org/2000/svg" width="930" height="790" viewBox="0 0 930 790" role="img" aria-labelledby="title desc"><title id="title">Illustrative A-SDLC advisor landscape</title><desc id="desc">Nine illustrative lifecycle and advisor pairings, with ADR preflight as the demonstrated starting point. Other advisor workloads are proposed, not implemented.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#8092a3"/></marker></defs><rect width="930" height="790" fill="#ffffff" rx="12"/><text x="25" y="34" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#203449">Where EDH fits in an agentic delivery lifecycle</text><text x="25" y="60" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#203449">Illustrative advisor map · iterative lifecycle · not a normative framework</text><text x="35" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">Lifecycle activity</text><text x="365" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">AI advisor role</text><text x="620" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">Candidate bounded task</text><rect x="25" y="111" width="300" height="49" rx="8" fill="#f1f5f9" stroke="#bdcbd7"/><text x="40" y="141" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#203449">Discovery</text><rect x="350" y="111" width="240" height="49" rx="8" fill="#f8fafc" stroke="#c7d3df"/><text x="365" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#203449">Product Advisor</text><path d="M325 136 H350" stroke="#8092a3" stroke-dasharray="4 3"/><text x="615" y="141" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Classify intent and constraints</text><path d="M175 160 V174" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="174" width="300" height="49" rx="8" fill="#f1f5f9" stroke="#bdcbd7"/><text x="40" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#203449">Requirements</text><rect x="350" y="174" width="240" height="49" rx="8" fill="#f8fafc" stroke="#c7d3df"/><text x="365" y="204" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#203449">Requirements Advisor</text><path d="M325 199 H350" stroke="#8092a3" stroke-dasharray="4 3"/><text x="615" y="204" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Check specification completeness</text><path d="M175 223 V237" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="237" width="300" height="49" rx="8" fill="#d9f3ec" stroke="#0f766e"/><text x="40" y="267" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#203449">Architecture &amp; ADR</text><rect x="350" y="237" width="240" height="49" rx="8" fill="#d9f3ec" stroke="#0f766e"/><text x="365" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">Architecture Advisor</text><path d="M325 262 H350" stroke="#0f766e" stroke-dasharray="4 3"/><text x="615" y="267" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#203449">Identify ADR conflicts; preflight</text><path d="M175 286 V300" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="300" width="300" height="49" rx="8" fill="#f1f5f9" stroke="#bdcbd7"/><text x="40" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#203449">Implementation planning</text><rect x="350" y="300" width="240" height="49" rx="8" fill="#f8fafc" stroke="#c7d3df"/><text x="365" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#203449">Planning Advisor</text><path d="M325 325 H350" stroke="#8092a3" stroke-dasharray="4 3"/><text x="615" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Check required plan steps</text><path d="M175 349 V363" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="363" width="300" height="49" rx="8" fill="#f1f5f9" stroke="#bdcbd7"/><text x="40" y="393" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#203449">Construction</text><rect x="350" y="363" width="240" height="49" rx="8" fill="#f8fafc" stroke="#c7d3df"/><text x="365" y="393" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#203449">Engineering Advisor</text><path d="M325 388 H350" stroke="#8092a3" stroke-dasharray="4 3"/><text x="615" y="393" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Check local engineering conventions</text><path d="M175 412 V426" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="426" width="300" height="49" rx="8" fill="#f1f5f9" stroke="#bdcbd7"/><text x="40" y="456" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#203449">Testing &amp; verification</text><rect x="350" y="426" width="240" height="49" rx="8" fill="#f8fafc" stroke="#c7d3df"/><text x="365" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#203449">Quality Advisor</text><path d="M325 451 H350" stroke="#8092a3" stroke-dasharray="4 3"/><text x="615" y="456" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Map tests to acceptance criteria</text><path d="M175 475 V489" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="489" width="300" height="49" rx="8" fill="#f1f5f9" stroke="#bdcbd7"/><text x="40" y="519" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#203449">Security &amp; compliance</text><rect x="350" y="489" width="240" height="49" rx="8" fill="#f8fafc" stroke="#c7d3df"/><text x="365" y="519" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#203449">Security Advisor</text><path d="M325 514 H350" stroke="#8092a3" stroke-dasharray="4 3"/><text x="615" y="519" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Triage policy evidence</text><path d="M175 538 V552" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="552" width="300" height="49" rx="8" fill="#f1f5f9" stroke="#bdcbd7"/><text x="40" y="582" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#203449">Delivery &amp; release</text><rect x="350" y="552" width="240" height="49" rx="8" fill="#f8fafc" stroke="#c7d3df"/><text x="365" y="582" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#203449">Delivery Advisor</text><path d="M325 577 H350" stroke="#8092a3" stroke-dasharray="4 3"/><text x="615" y="582" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Check release evidence completeness</text><path d="M175 601 V615" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="615" width="300" height="49" rx="8" fill="#f1f5f9" stroke="#bdcbd7"/><text x="40" y="645" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#203449">Operations &amp; feedback</text><rect x="350" y="615" width="240" height="49" rx="8" fill="#f8fafc" stroke="#c7d3df"/><text x="365" y="645" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#203449">Operations Advisor</text><path d="M325 640 H350" stroke="#8092a3" stroke-dasharray="4 3"/><text x="615" y="645" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Extract and classify operational facts</text><rect x="25" y="695" width="880" height="48" rx="8" fill="#e1f5f1" stroke="#0f766e"/><text x="465" y="725" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f655e">Potential shared layer: context · inference routing · governance · evidence · observability</text><text x="25" y="773" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Teal ADR row = demonstrated reference domain; other advisor tasks = research candidates.</text></svg>
