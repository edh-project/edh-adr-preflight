<svg xmlns="http://www.w3.org/2000/svg" width="930" height="640" viewBox="0 0 930 640" role="img" aria-labelledby="title desc"><title id="title">Candidate shared A-SDLC platform services</title><desc id="desc">Illustrative advisors use a proposed shared infrastructure layer, connected to research directions. Readiness varies by component; integrated reuse has not been demonstrated.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#8092a3"/></marker></defs><rect width="930" height="640" fill="#ffffff" rx="12"/><text x="25" y="35" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#203449">From one preflight domain to potentially reusable services</text><text x="25" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#203449">Research architecture — not an implemented shared platform</text><rect x="25" y="84" width="284" height="44" rx="8" fill="#f1f5f9" stroke="#b5c6d4"/><text x="167" y="111" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#203449">Product / requirements</text><rect x="323" y="84" width="284" height="44" rx="8" fill="#d9f3ec" stroke="#0f766e"/><text x="465" y="111" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#203449">Architecture / planning</text><rect x="621" y="84" width="284" height="44" rx="8" fill="#f1f5f9" stroke="#b5c6d4"/><text x="763" y="111" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#203449">Engineering / quality</text><rect x="25" y="141" width="284" height="44" rx="8" fill="#f1f5f9" stroke="#b5c6d4"/><text x="167" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#203449">Security / compliance</text><rect x="323" y="141" width="284" height="44" rx="8" fill="#f1f5f9" stroke="#b5c6d4"/><text x="465" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#203449">Delivery</text><rect x="621" y="141" width="284" height="44" rx="8" fill="#f1f5f9" stroke="#b5c6d4"/><text x="763" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#203449">Operations</text><path d="M167 185 V205 H465 M465 185 V225 M763 185 V205 H465" fill="none" stroke="#8092a3" stroke-width="2"/><path d="M465 205 V225" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="225" width="880" height="365" rx="12" fill="#f0faf8" stroke="#0f766e"/><text x="465" y="254" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#0f655e">Candidate shared platform layer</text><rect x="42" y="271" width="846" height="52" rx="8" fill="#ffffff" stroke="#bfd4d1"/><text x="55" y="291" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">Context and architectural knowledge</text><text x="55" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203449">R01 · R04 · R10-A</text><text x="875" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#203449">Research candidates</text><rect x="42" y="332" width="846" height="52" rx="8" fill="#ffffff" stroke="#bfd4d1"/><text x="55" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">Model harness and inference routing</text><text x="55" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203449">R03 · R10-B</text><text x="875" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#203449">Reference adapter; broader routing research</text><rect x="42" y="393" width="846" height="52" rx="8" fill="#ffffff" stroke="#bfd4d1"/><text x="55" y="413" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">Admission and bounded tool execution</text><text x="55" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203449">R08</text><text x="875" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#203449">Standalone synthetic PoC</text><rect x="42" y="454" width="846" height="52" rx="8" fill="#ffffff" stroke="#bfd4d1"/><text x="55" y="474" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">Independent verification and evidence</text><text x="55" y="493" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203449">R02 · R05 · R09</text><text x="875" y="483" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#203449">Separate evidence; integrated reuse unverified</text><rect x="42" y="515" width="846" height="52" rx="8" fill="#ffffff" stroke="#bfd4d1"/><text x="55" y="535" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203449">Quality, cost and resource observability</text><text x="55" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203449">R06 · R10-B</text><text x="875" y="544" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#203449">Research candidates</text><text x="25" y="617" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#203449">Interoperability (R07), explicit human authority and knowledge/IP controls apply across layers.</text></svg>
