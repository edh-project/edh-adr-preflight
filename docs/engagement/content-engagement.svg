<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img"><title>Content engagement</title><desc>Public release policy</desc><rect width="1000" height="250" rx="20" fill="#101827"/><g font-family="Arial,sans-serif" fill="#f1f5f9"><text x="32" y="43" font-size="28" font-weight="700">Content engagement</text><text x="32" y="72" font-size="15" fill="#b6c5d7">Public release policy</text><text x="32" y="126" font-size="32" fill="#f1f5f9">Not reported</text><text x="32" y="169" font-size="18" fill="#b6c5d7">Content-level metrics are not included in this report.</text><text x="32" y="205" font-size="16" fill="#b6c5d7">Rolling lists cannot be treated as fixed weekly cohorts.</text></g></svg>
