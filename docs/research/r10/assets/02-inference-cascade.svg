<svg xmlns="http://www.w3.org/2000/svg" width="800" height="675" viewBox="0 0 800 675"><rect width="800" height="675" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker></defs><text x="20" y="30" font-family="Arial,sans-serif" font-size="21" text-anchor="start" font-weight="700" fill="#172b3e">Multi-tier inference cascade</text><rect x="40" y="50" width="460" height="62" rx="7" fill="#f1f5f9" stroke="#91b7b5"/><text x="270" y="75" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#172b3e">Proposed ADR + versioned context</text><text x="270" y="97" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#172b3e"></text><path d="M270 112 L270 136" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="136" width="460" height="62" rx="7" fill="#f1f5f9" stroke="#91b7b5"/><text x="270" y="161" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#172b3e">Tier 0 — deterministic checks</text><text x="270" y="183" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#172b3e">Schema, rules and references</text><path d="M270 198 L270 222" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="222" width="460" height="62" rx="7" fill="#ccfbf1" stroke="#91b7b5"/><text x="270" y="247" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#172b3e">Tier 1 — local SLM (2–4B)</text><text x="270" y="269" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#172b3e">Bounded semantic checks + evidence gate</text><path d="M270 284 L270 308" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="308" width="460" height="62" rx="7" fill="#f1f5f9" stroke="#91b7b5"/><text x="270" y="333" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#172b3e">Tier 2 — larger local model (9–31B)</text><text x="270" y="355" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#172b3e">Complex or unresolved reasoning + evidence gate</text><path d="M270 370 L270 394" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="394" width="460" height="62" rx="7" fill="#f1f5f9" stroke="#91b7b5"/><text x="270" y="419" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#172b3e">Tier 3 — approved cloud model</text><text x="270" y="441" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#172b3e">Only when external disclosure is permitted</text><path d="M270 456 L270 480" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="480" width="460" height="62" rx="7" fill="#f1f5f9" stroke="#91b7b5"/><text x="270" y="505" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#172b3e">Tier 4 — human review</text><text x="270" y="527" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#172b3e">Mandatory review, exceptions, accountability</text><path d="M500 167 H695 V600 M500 253 H695 M500 339 H695 M270 542 V600 H695" fill="none" stroke="#0f766e" stroke-width="2"/><text x="514" y="153" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">Deterministic result</text><text x="514" y="239" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">Verified, low risk</text><text x="514" y="325" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">Verified, low risk</text><path d="M695 600 H400 V620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="620" width="460" height="40" rx="7" fill="#e8f3f2" stroke="#91b7b5"/><text x="400" y="646" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#172b3e">Preflight result — not architectural approval</text></svg>