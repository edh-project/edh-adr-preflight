<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320"><rect width="800" height="320" fill="#fff"/><text x="20" y="30" font-family="Arial,sans-serif" font-size="21" text-anchor="start" font-weight="700" fill="#172b3e">Enterprise total cost of ownership</text><rect x="20" y="50" width="375" height="72" rx="7" fill="#e8f3f2" stroke="#91b7b5"/><text x="33" y="75" font-family="Arial,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#0f766e">Infrastructure</text><text x="33" y="99" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">Hardware, rental, redundant capacity</text><rect x="405" y="50" width="375" height="72" rx="7" fill="#e8f3f2" stroke="#91b7b5"/><text x="418" y="75" font-family="Arial,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#0f766e">Resource consumption</text><text x="418" y="99" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">Energy, cooling, memory, utilization</text><rect x="20" y="135" width="375" height="72" rx="7" fill="#e8f3f2" stroke="#91b7b5"/><text x="33" y="160" font-family="Arial,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#0f766e">Platform operations</text><text x="33" y="184" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">Monitoring, upgrades, on-call</text><rect x="405" y="135" width="375" height="72" rx="7" fill="#e8f3f2" stroke="#91b7b5"/><text x="418" y="160" font-family="Arial,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#0f766e">Inference consumption</text><text x="418" y="184" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">Local compute, cloud tokens, retries</text><rect x="20" y="220" width="375" height="72" rx="7" fill="#e8f3f2" stroke="#91b7b5"/><text x="33" y="245" font-family="Arial,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#0f766e">Governance</text><text x="33" y="269" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">Security, auditability, human review</text><rect x="405" y="220" width="375" height="72" rx="7" fill="#e8f3f2" stroke="#91b7b5"/><text x="418" y="245" font-family="Arial,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#0f766e">Failure-related costs</text><text x="418" y="269" font-family="Arial,sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#172b3e">False acceptance, rejection and rework</text></svg>