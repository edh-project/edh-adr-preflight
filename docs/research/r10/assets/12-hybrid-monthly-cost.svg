<svg xmlns="http://www.w3.org/2000/svg" width="760" height="104" viewBox="0 0 760 104" role="img" aria-labelledby="title description"><title id="title">Hybrid monthly cost</title><desc id="description">C hybrid equals F plus N times the sum of v sub s, r sub l times v sub l, and r sub c times c.</desc><rect x="1" y="1" width="758" height="102" rx="10" fill="#ffffff" stroke="#d4dce5"/><text x="380" y="63" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, Times New Roman, serif" font-size="34" fill="#14263b" xml:space="preserve"><tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="20" font-style="normal">hybrid</tspan> = <tspan font-style="italic">F</tspan> + <tspan font-style="italic">N</tspan> ( <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="20" font-style="italic">s</tspan> + <tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="20" font-style="italic">l</tspan><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="20" font-style="italic">l</tspan> + <tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="20" font-style="italic">c</tspan><tspan font-style="italic">c</tspan> )</text></svg>
