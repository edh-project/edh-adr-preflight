<svg xmlns="http://www.w3.org/2000/svg" width="760" height="157" viewBox="0 0 760 157" role="img" aria-labelledby="title description"><title id="title">Monthly break-even volume</title><desc id="description">N is greater than F divided by the quantity (1 minus r sub c) times c minus v sub s minus r sub l times v sub l.</desc><rect x="1" y="1" width="758" height="155" rx="10" fill="#ffffff" stroke="#d4dce5"/><text x="180" y="88" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, Times New Roman, serif" font-size="38" fill="#14263b" xml:space="preserve"><tspan font-style="italic">N</tspan> &gt;</text><text x="420" y="52" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, Times New Roman, serif" font-size="34" fill="#14263b" xml:space="preserve"><tspan font-style="italic">F</tspan></text><line x1="235" x2="605" y1="69" y2="69" stroke="#14263b" stroke-width="2.1"/><text x="420" y="108" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, Times New Roman, serif" font-size="31" fill="#14263b" xml:space="preserve">(1 − <tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="20" font-style="italic">c</tspan>)<tspan font-style="italic">c</tspan> − <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="20" font-style="italic">s</tspan> − <tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="20" font-style="italic">l</tspan><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="20" font-style="italic">l</tspan></text></svg>
