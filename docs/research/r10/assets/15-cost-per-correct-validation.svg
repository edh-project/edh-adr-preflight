<svg xmlns="http://www.w3.org/2000/svg" width="760" height="157" viewBox="0 0 760 157" role="img" aria-labelledby="title description"><title id="title">Cost per correctly resolved validation</title><desc id="description">C correct equals total attributable cost divided by correctly resolved validations.</desc><rect x="1" y="1" width="758" height="155" rx="10" fill="#ffffff" stroke="#d4dce5"/><text x="164" y="88" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, Times New Roman, serif" font-size="34" fill="#14263b" xml:space="preserve"><tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="20" font-style="normal">correct</tspan> =</text><text x="456" y="53" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, Times New Roman, serif" font-size="28" fill="#14263b" xml:space="preserve">Total attributable cost</text><line x1="262" x2="650" y1="69" y2="69" stroke="#14263b" stroke-width="2.1"/><text x="456" y="108" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, Times New Roman, serif" font-size="27" fill="#14263b" xml:space="preserve">Correctly resolved validations</text></svg>
