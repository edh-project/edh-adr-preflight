<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title description"><title id="title">R10-B: inference economics</title><desc id="description">Illustrative nested cascade counts and costs, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#75879a"/></marker></defs><rect width="800" height="560" rx="12" fill="#fff"/><text x="400" y="28" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#23374a">R10-B · Inference routing and cost</text><text x="30" y="61" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#23374a">Monthly validation requests by tier (illustrative)</text><text x="30" y="98" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#23374a">Small local SLM</text><rect x="230" y="80" width="450" height="23" rx="9" fill="#edf2f6" stroke="none"/><rect x="230" y="80" width="450" height="23" rx="9" fill="#0f766e" stroke="none"/><text x="760" y="98" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#23374a">10,000</text><text x="30" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#23374a">Larger local model</text><rect x="230" y="127" width="450" height="23" rx="9" fill="#edf2f6" stroke="none"/><rect x="230" y="127" width="90" height="23" rx="9" fill="#2563eb" stroke="none"/><text x="760" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#23374a">2,000</text><text x="30" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#23374a">Premium cloud</text><rect x="230" y="174" width="450" height="23" rx="9" fill="#edf2f6" stroke="none"/><rect x="230" y="174" width="45" height="23" rx="9" fill="#7c3aed" stroke="none"/><text x="760" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#23374a">1,000</text><text x="30" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#23374a">Monthly cost for this workload (USD)</text><text x="30" y="280" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#23374a">Premium cloud only</text><rect x="230" y="262" width="450" height="24" rx="9" fill="#edf2f6" stroke="none"/><rect x="230" y="262" width="450" height="24" rx="9" fill="#64748b" stroke="none"/><text x="760" y="280" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#23374a">$1,040</text><text x="30" y="327" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#23374a">Hybrid inference</text><rect x="230" y="309" width="450" height="24" rx="9" fill="#edf2f6" stroke="none"/><rect x="230" y="309" width="127.21153846153847" height="24" rx="9" fill="#0f766e" stroke="none"/><text x="760" y="327" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#23374a">$294</text><rect x="30" y="374" width="240" height="92" rx="9" fill="#e1f5f1" stroke="#8abcb5"/><text x="150" y="411" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#0f766e">90%</text><text x="150" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#23374a">Fewer cloud calls</text><rect x="280" y="374" width="240" height="92" rx="9" fill="#e1f5f1" stroke="#8abcb5"/><text x="400" y="411" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#0f766e">71.7%</text><text x="400" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#23374a">Workload cost reduction</text><rect x="530" y="374" width="240" height="92" rx="9" fill="#e1f5f1" stroke="#8abcb5"/><text x="650" y="411" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#0f766e">14.3%</text><text x="650" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#23374a">Overall net reduction*</text><text x="400" y="495" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#23374a">* If eligible work accounts for 20% of baseline enterprise LLM expenditure.</text><text x="400" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#23374a">Synthetic scenario; quality parity and complete TCO are not established.</text><text x="400" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#23374a">Differential human review and failure costs excluded.</text></svg>
