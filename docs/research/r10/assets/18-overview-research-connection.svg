<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title description"><title id="title">Connection between workstreams</title><desc id="description">Hypothesized causal chain, bounded by evidence and risk.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#75879a"/></marker></defs><rect width="800" height="410" rx="12" fill="#fff"/><text x="400" y="28" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#23374a">How the two workstreams connect</text><rect x="105" y="48" width="590" height="65" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="400" y="73" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23374a">Structured architectural knowledge</text><text x="400" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#23374a">Context engineering</text><path d="M400 113 V133" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="133" width="590" height="65" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="400" y="158" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23374a">Improved bounded SLM task performance</text><text x="400" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#23374a">Hypothesis · measure against gold labels</text><path d="M400 198 V218" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="218" width="590" height="65" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="400" y="243" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23374a">Fewer expensive model invocations</text><text x="400" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#23374a">Risk-controlled routing · independent evidence gate</text><path d="M400 283 V303" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="303" width="590" height="65" rx="9" fill="#e1f5f1" stroke="#0f766e"/><text x="400" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23374a">Lower total inference cost</text><text x="400" y="349" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#23374a">Hypothesis · compare at matched quality and service levels</text><text x="400" y="402" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#23374a">Each causal link requires experimental evidence.</text></svg>
