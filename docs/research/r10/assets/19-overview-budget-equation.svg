<svg xmlns="http://www.w3.org/2000/svg" width="800" height="115" viewBox="0 0 800 115" role="img" aria-labelledby="title description"><title id="title">Overall net savings</title><desc id="description">Overall savings equals eligible baseline spend share multiplied by net eligible workload savings.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#75879a"/></marker></defs><rect width="800" height="115" rx="12" fill="#fff"/><text x="400" y="48" text-anchor="middle" font-family="Cambria Math, Georgia, serif" font-size="31" fill="#23374a"><tspan font-style="italic">S</tspan><tspan baseline-shift="sub" font-size="17">overall</tspan> = <tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="17">eligible</tspan> × <tspan font-style="italic">S</tspan><tspan baseline-shift="sub" font-size="17">workload</tspan></text><text x="400" y="86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#23374a">20% × 71.7% ≈ 14.3% overall net savings</text></svg>
