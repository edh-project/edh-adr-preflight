<svg xmlns="http://www.w3.org/2000/svg" width="800" height="690" viewBox="0 0 800 690" role="img" aria-labelledby="title description"><title id="title">Interdisciplinary research positioning</title><desc id="description">R10 connects context engineering, small language models and inference economics with architectural governance in Agentic SDLC.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#75879a"/></marker></defs><rect width="800" height="690" rx="12" fill="#fff"/><text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#23374a">Interdisciplinary Research Positioning</text><circle cx="285" cy="255" r="209" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-width="1.8"/><circle cx="515" cy="255" r="209" fill="#0d9488" fill-opacity=".08" stroke="#0d9488" stroke-width="1.8"/><circle cx="400" cy="446" r="209" fill="#d97706" fill-opacity=".08" stroke="#d97706" stroke-width="1.8"/><text x="220" y="165" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#23374a">Context</text><text x="220" y="195" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#23374a">Engineering</text><text x="220" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#23374a">Representation · retrieval</text><text x="580" y="165" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#23374a">Small Language</text><text x="580" y="195" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#23374a">Models</text><text x="580" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#23374a">Capability · quantization</text><rect x="287" y="295" width="226" height="112" rx="9" fill="#0f766e" stroke="#0f766e"/><text x="400" y="324" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">R10</text><text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#fff">Architectural Governance</text><text x="400" y="374" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#fff">in Agentic SDLC</text><text x="400" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#fff">Proposed research</text><text x="400" y="535" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#23374a">Inference Economics</text><text x="400" y="565" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#23374a">&amp; Enterprise FinOps</text><text x="400" y="591" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#23374a">Risk-bounded cost per correct validation</text><text x="400" y="675" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#23374a">Conceptual positioning — not a claim of established scientific novelty.</text></svg>
