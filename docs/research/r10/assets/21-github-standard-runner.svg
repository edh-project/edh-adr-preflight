<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">Option A — Public standard hosted runner</title><desc id="desc">Transient public repository CI benchmark; no runner compute charge, not zero total cost or a persistent endpoint.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#8092a3"/></marker></defs><rect width="880" height="520" fill="#ffffff" rx="12"/><text x="25" y="35" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#21364a">A · Public GitHub Actions standard runner</text><text x="25" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#21364a">Repository-related synthetic benchmark · ephemeral compute</text><rect x="25" y="82" width="830" height="249" rx="9" fill="#f8fafc" stroke="#b5c6d4"/><text x="43" y="106" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#21364a">GitHub-hosted Ubuntu · 4 vCPU / 16 GB RAM</text><rect x="43" y="124" width="250" height="57" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="168" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Dispatch CI job</text><text x="168" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Authorized synthetic cases</text><path d="M293 153 H312" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="312" y="124" width="250" height="57" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="437" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Restore / verify GGUF</text><text x="437" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Pinned revision and SHA-256</text><path d="M562 153 H581" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="581" y="124" width="250" height="57" rx="9" fill="#e1f5f1" stroke="#0f766e"/><text x="706" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Start llama.cpp</text><text x="706" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Loopback only</text><rect x="43" y="221" width="250" height="57" rx="9" fill="#e1f5f1" stroke="#0f766e"/><text x="168" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Execute batch</text><text x="168" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Measure time, RAM, quality</text><path d="M293 250 H312" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="312" y="221" width="250" height="57" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="437" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Upload evidence</text><text x="437" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Minimized report</text><path d="M562 250 H581" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="581" y="221" width="250" height="57" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="706" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Terminate job</text><text x="706" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">No persistent endpoint</text><path d="M831 153 H842 V202 H35 V250 H43" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="25" y="349" width="260" height="115" rx="9" fill="#e1f5f1" stroke="#0f766e"/><text x="155" y="386" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#0f766e">$0</text><text x="155" y="411" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#21364a">Standard runner compute</text><text x="155" y="435" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Not zero total cost</text><rect x="300" y="349" width="555" height="115" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="316" y="374" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#21364a">Best use</text><text x="316" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Reproducible public Qwen 4B Q5 feasibility benchmark</text><text x="316" y="423" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Limits: CPU speed unmeasured; six-hour job limit;</text><text x="316" y="445" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">cache / artifact limits; no persistent service.</text><text x="25" y="498" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Candidate fit, not measured hosted performance. No paid compute authorized.</text></svg>
