<svg xmlns="http://www.w3.org/2000/svg" width="880" height="636" viewBox="0 0 880 636" role="img" aria-labelledby="title desc"><title id="title">Option B — Paid hosted runners</title><desc id="desc">Illustrative billed compute at list rates; batch size strongly influences cost. All performance assumptions synthetic.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#8092a3"/></marker></defs><rect width="880" height="636" fill="#ffffff" rx="12"/><text x="25" y="35" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#21364a">B · Paid GitHub-hosted CPU / GPU runners</text><text x="25" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#21364a">Eligible organization · transient benchmark · rates before allowances</text><text x="25" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#21364a">Representative configurations</text><rect x="25" y="112" width="410" height="49" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="37" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#21364a">ARM 4 vCPU / 16 GB</text><text x="422" y="142" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#21364a">$0.48/h</text><rect x="445" y="112" width="410" height="49" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="457" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#21364a">ARM 8 vCPU / 32 GB</text><text x="842" y="142" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#21364a">$0.84/h</text><rect x="25" y="171" width="410" height="49" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="37" y="201" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#21364a">x64 16 vCPU / 64 GB</text><text x="422" y="201" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#21364a">$2.52/h</text><rect x="445" y="171" width="410" height="49" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="457" y="201" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#21364a">Tesla T4 / 16 GB VRAM</text><text x="842" y="201" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#21364a">$3.12/h</text><text x="25" y="251" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#21364a">Batch economics · T4 example</text><text x="25" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">10,000 validations/month · 180 s setup/job · assumed 5 s/validation</text><text x="25" y="314" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#21364a">100 requests/job</text><rect x="208" y="296" width="510" height="27" rx="9" fill="#edf2f6" stroke="none"/><rect x="208" y="296" width="15.3" height="27" rx="9" fill="#0f766e" stroke="none"/><text x="853" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#21364a">$62.40</text><text x="25" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#21364a">1 request/job</text><rect x="208" y="360" width="510" height="27" rx="9" fill="#edf2f6" stroke="none"/><rect x="208" y="360" width="510" height="27" rx="9" fill="#64748b" stroke="none"/><text x="853" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#21364a">$2,080.00</text><rect x="25" y="432" width="830" height="143" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="42" y="460" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#21364a">Best use: controlled CPU/GPU and larger-model experiments</text><text x="42" y="486" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">4B / 9B candidates; larger models require actual RAM / VRAM fit tests.</text><text x="42" y="510" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Billing is per job, including model load and artifact work.</text><text x="42" y="534" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Requires verified entitlement, budget and approved runner configuration.</text><text x="42" y="557" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">A hosted runner is not a permanent shared inference endpoint.</text><text x="25" y="610" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Synthetic latency; compute only; no quality parity or measured hosted speed.</text></svg>
