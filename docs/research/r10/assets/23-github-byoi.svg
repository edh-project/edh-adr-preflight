<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="title desc"><title id="title">Option C — Reuse an existing inference endpoint</title><desc id="desc">Separates CI orchestration from independently governed inference service and cost boundary.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#8092a3"/></marker></defs><rect width="880" height="510" fill="#ffffff" rx="12"/><text x="25" y="35" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#21364a">C · Reuse an existing inference endpoint (BYOI)</text><text x="25" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#21364a">Orchestration and model hosting are separate cost and trust boundaries</text><rect x="25" y="87" width="330" height="240" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="190" y="115" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#21364a">GitHub Actions</text><rect x="45" y="133" width="290" height="55" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="190" y="157" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Authorized synthetic request</text><text x="190" y="177" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Trusted configuration</text><rect x="45" y="238" width="290" height="55" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="190" y="262" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Validate / retain evidence</text><text x="190" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Minimized public report</text><rect x="525" y="87" width="330" height="240" rx="9" fill="#e1f5f1" stroke="#0f766e"/><text x="690" y="115" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#21364a">Approved inference service</text><rect x="545" y="133" width="290" height="55" rx="9" fill="#e1f5f1" stroke="#0f766e"/><text x="690" y="157" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Authenticate and admit</text><text x="690" y="177" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Separate ownership / policy</text><rect x="545" y="238" width="290" height="55" rx="9" fill="#e1f5f1" stroke="#0f766e"/><text x="690" y="262" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#21364a">Run selected model</text><text x="690" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#21364a">Return bounded response</text><path d="M335 160 H545" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="440" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#21364a">HTTPS request</text><path d="M690 188 V238" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M545 265 H335" stroke="#8092a3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="440" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#21364a">Result</text><text x="190" y="313" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#21364a">CI orchestration cost</text><text x="690" y="313" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f766e">Endpoint inference + TCO</text><rect x="25" y="347" width="830" height="120" rx="9" fill="#f1f5f9" stroke="#b5c6d4"/><text x="42" y="375" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#21364a">Best use: evaluate reuse of an existing enterprise service</text><text x="42" y="400" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">No model load on CI runner; shared endpoint may amortize initialization.</text><text x="42" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Control disclosure, credentials, availability, ownership and cost attribution.</text><text x="42" y="448" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Do not expose a personal workstation or attach it to public CI.</text><text x="25" y="493" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#21364a">Candidate integration pattern; no production connection or new endpoint authorized.</text></svg>
