<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-labelledby="title desc"><title id="title">Batch compute cost</title><desc id="desc">Number of jobs equals ceiling N divided by B. Compute cost sums the runner rate multiplied by the rounded-up minutes of each job.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#8092a3"/></marker></defs><rect width="880" height="170" fill="#ffffff" rx="12"/><text x="440" y="49" text-anchor="middle" font-family="Cambria Math, Georgia, serif" font-size="30" fill="#21364a">J = ⌈N / B⌉</text><text x="440" y="91" text-anchor="middle" font-family="Cambria Math, Georgia, serif" font-size="29" fill="#21364a">C = r · ∑<tspan baseline-shift="sub" font-size="16">j=1</tspan><tspan baseline-shift="super" font-size="16">J</tspan> ⌈(s + b<tspan baseline-shift="sub" font-size="17">j</tspan>t) / 60⌉</text><text x="440" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#21364a">bⱼ = actual validations in job j; rate r in USD per billed minute</text></svg>
