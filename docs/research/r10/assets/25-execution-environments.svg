<svg xmlns="http://www.w3.org/2000/svg" width="870" height="420" viewBox="0 0 870 420"><rect width="870" height="420" rx="10" fill="#fff"/><g font-family="Arial,sans-serif" fill="#203449"><text x="28" y="38" font-size="25" font-weight="700">Three execution environments, one protocol</text><text x="28" y="65" font-size="15">Frozen synthetic corpus and shared scoring contract</text><rect x="28" y="125" width="258" height="82" rx="8" fill="#eef4f6" stroke="#8296a9"/><text x="43" y="155" font-size="19" font-weight="700">Free hosted CPU</text><text x="43" y="181" font-size="15">Measured twice</text><path d="M157 207 V250 H435 V278" stroke="#8296a9" fill="none"/><rect x="306" y="125" width="258" height="82" rx="8" fill="#eef4f6" stroke="#8296a9"/><text x="321" y="155" font-size="19" font-weight="700">Paid CPU / GPU</text><text x="321" y="181" font-size="15">Not executed</text><path d="M435 207 V250 H435 V278" stroke="#8296a9" fill="none"/><rect x="584" y="125" width="258" height="82" rx="8" fill="#eef4f6" stroke="#8296a9"/><text x="599" y="155" font-size="19" font-weight="700">Secure BYOI</text><text x="599" y="181" font-size="15">Local gateway tested</text><path d="M713 207 V250 H435 V278" stroke="#8296a9" fill="none"/><rect x="180" y="278" width="510" height="78" rx="8" fill="#e0f4ef" stroke="#0d9488"/><text x="435" y="309" font-size="21" font-weight="700" text-anchor="middle">Common evidence and evaluation</text><text x="435" y="334" font-size="15" text-anchor="middle">Quality · latency · tokens · provenance · checksums</text><text x="28" y="394" font-size="15">No production authority; external access remains subject to admission.</text></g></svg>
