<title id="title">R10 BYOI — private Workers VPC transport candidate</title>
<desc id="desc">GitHub Actions reaches a dedicated Worker with machine admission, a private VPC service and an outbound encrypted tunnel to a restricted local gateway and Qwen 4B. Design only, not deployed.</desc>
