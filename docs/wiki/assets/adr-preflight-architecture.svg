cks</text><path d="M62 322 H938" stroke="#e2e8f0"/><text x="66" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Invalid → REJECT, zero model calls</text><path d="M500 388 V407 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M500 407 H188.66666666666666 V423" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500 407 H500 V423" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500 407 H811.3333333333333 V423" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="426" width="293.3333333333333" height="174" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="446" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="464" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Optional triage</text><path d="M62 480 H315.3333333333333" stroke="#e2e8f0"/><text x="66" y="502" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Small model, when</text><text x="66" y="529" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">configured</text><rect x="353.3333333333333" y="426" width="293.3333333333333" height="174" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="370.3333333333333" y="446" width="5" height="25" rx="2" fill="#a17428"/><text x="383.3333333333333" y="464" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Primary review</text><path d="M373.3333333333333 480 H626.6666666666666" stroke="#e2e8f0"/><text x="377.3333333333333" y="502" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor