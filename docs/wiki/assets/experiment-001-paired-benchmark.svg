<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="959" viewBox="0 0 1000 959" role="img" aria-labelledby="title desc"><title id="title">EXPERIMENT 001 · JSON vs JSONL</title><desc id="desc">Paired format comparison · identical records and decoding settings. Fixture success is not evidence of model performance or JSONL superiority</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="1000" height="959" rx="20" fill="#f8fafc"/><text x="500" y="42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172435" text-anchor="middle">EXPERIMENT 001 · JSON vs JSONL</text><text x="500" y="75" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">Paired format comparison · identical records and decoding settings</text><rect x="42" y="110" width="916" height="120" rx="15" fill="#eef4f9" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="130" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="148" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Six labeled synthetic cases</text><path d="M62 164 H938" stroke="#e2e8f0"/><text x="66" y="186" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Three clean · three conflicting · gold labels held outside live prompts</text><path d="M500 230 V249 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M500 249 H266.5 V265" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500 249 H733.5 V265" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="268" width="449" height="120" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="288" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="306" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Baseline: JSON</text><path d="M62 322 H471" stroke="#e2e8f0"/><text x="66" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Array input / array output</text><rect x="509" y="268" width="449" height="120" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="526" y="288" width="5" height="25" rx="2" fill="#a17428"/><text x="539" y="306" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Candidate: JSONL</text><path d="M529 322 H938" stroke="#e2e8f0"/><text x="533" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Line-oriented input / output</text><path d="M266.5 388 V407 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M733.5 388 V407 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M500 407 H500 V423" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="426" width="916" height="120" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="446" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="464" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Same served model and settings</text><path d="M62 480 H938" stroke="#e2e8f0"/><text x="66" y="502" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Three repetitions · 18 pairs · 36 requests per model in live mode</text><path d="M500 546 V565 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M500 565 H266.5 V581" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500 565 H733.5 V581" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="584" width="449" height="147" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="604" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="622" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Quality</text><path d="M62 638 H471" stroke="#e2e8f0"/><text x="66" y="660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Exact match · TP / FP / FN ·</text><text x="66" y="687" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">validity</text><rect x="509" y="584" width="449" height="147" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="526" y="604" width="5" height="25" rx="2" fill="#a17428"/><text x="539" y="622" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Efficiency</text><path d="M529 638 H938" stroke="#e2e8f0"/><text x="533" y="660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Paired latency and token usage when</text><text x="533" y="687" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">available</text><path d="M266.5 731 V750 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M733.5 731 V750 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M500 750 H500 V766" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="769" width="916" height="120" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="789" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="807" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Evidence and prespecified verdict</text><path d="M62 823 H938" stroke="#e2e8f0"/><text x="66" y="845" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Fixture CI: HARNESS_ONLY_NOT_MEASURED · live model result unknown</text><text x="500" y="939" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Fixture success is not evidence of model performance or JSONL superiority</text></svg>