<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1016" viewBox="0 0 1000 1016" role="img" aria-labelledby="title desc"><title id="title">EXPERIMENT 002 · TEAM INTEGRATION</title><desc id="desc">Start with the team, not with a product. Six alternatives, not a mandatory adoption ladder</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="1000" height="1016" rx="20" fill="#f8fafc"/><text x="500" y="42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172435" text-anchor="middle">EXPERIMENT 002 · TEAM INTEGRATION</text><text x="500" y="75" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">Start with the team, not with a product</text><rect x="42" y="110" width="916" height="120" rx="15" fill="#eef4f9" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="130" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="148" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">Organizational objectives</text><path d="M62 164 H938" stroke="#e2e8f0"/><text x="66" y="186" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Team goals · existing workflow · observed problem · approved resources</text><path d="M500 230 V249 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M500 249 H266.5 V265" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500 249 H733.5 V265" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="268" width="449" height="147" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="288" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="306" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">A · Standalone advisory</text><path d="M62 322 H471" stroke="#e2e8f0"/><text x="66" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Local review; no platform write</text><text x="66" y="371" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">access</text><rect x="509" y="268" width="449" height="147" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="526" y="288" width="5" height="25" rx="2" fill="#a17428"/><text x="539" y="306" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">B · PR shadow mode</text><path d="M529 322 H938" stroke="#e2e8f0"/><text x="533" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Evidence only; no blocking</text><rect x="42" y="453" width="449" height="120" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="473" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="491" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">C · Native IDP</text><path d="M62 507 H471" stroke="#e2e8f0"/><text x="66" y="529" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Reuse existing orchestration</text><rect x="509" y="453" width="449" height="120" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="526" y="473" width="5" height="25" rx="2" fill="#a17428"/><text x="539" y="491" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">D · Existing governance</text><path d="M529 507 H938" stroke="#e2e8f0"/><text x="533" y="529" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Reuse authoritative controls</text><rect x="42" y="611" width="449" height="177" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="59" y="631" width="5" height="25" rx="2" fill="#256b9d"/><text x="72" y="649" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">E · Optional external</text><text x="72" y="679" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">provider</text><path d="M62 695 H471" stroke="#e2e8f0"/><text x="66" y="717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Only if a demonstrated gap and</text><text x="66" y="744" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">approvals</text><rect x="509" y="611" width="449" height="177" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="526" y="631" width="5" height="25" rx="2" fill="#a17428"/><text x="539" y="649" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172435" text-anchor="start">F · No integration / defer</text><path d="M529 665 H938" stroke="#e2e8f0"/><text x="533" y="687" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Existing solution sufficient or</text><text x="533" y="714" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">unresolved</text><path d="M266.5 788 V807 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M733.5 788 V807 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M500 807 H500 V823" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="826" width="916" height="120" rx="15" fill="#ffffff" stro