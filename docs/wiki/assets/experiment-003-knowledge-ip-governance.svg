<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title desc"><title id="title">Knowledge and IP Governance</title><desc id="desc">Public, optional restricted and internal zones with separate approvals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect width="1000" height="1020" rx="20" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="42" font-size="20" font-weight="700" fill="#a17428" text-anchor="middle">TRACK B · KNOWLEDGE &amp; IP GOVERNANCE</text><rect x="90" y="65" width="820" height="196" rx="14" fill="#f0f6fb" stroke="#cbd5e1" stroke-width="2"/><rect x="108" y="84" width="6" height="30" rx="3" fill="#256b9d"/><text x="126" y="108" font-size="25" font-weight="700" fill="#172435" text-anchor="start">PUBLIC</text><path d="M108 125H892" stroke="#e2e8f0"/><text x="114" y="157" font-size="20" font-weight="400" fill="#172435" text-anchor="start">Generic methodology and synthetic PoC</text><text x="114" y="188" font-size="20" font-weight="400" fill="#172435" text-anchor="start">Reviewed diagrams, criteria and discovery questions</text><text x="114" y="219" font-size="20" font-weight="400" fill="#172435" text-anchor="start">No organization-specific research or private implementation</text><path d="M500 261 V290" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="520" y="279" font-size="17" font-weight="400" fill="#475569" text-anchor="start">If justified</text><rect x="90" y="292" width="820" height="196" rx="14" fill="#faf6ec" stroke="#cbd5e1" stroke-width="2"/><rect x="108" y="311" width="6" height="30" rx="3" fill="#a17428"/><text x="126" y="335" font-size="25" font-weight="700" fill="#172435" text-anchor="start">RESTRICTED · OPTIONAL NDA-ONLY</text><path d="M108 352H892" stroke="#e2e8f0"/><text x="114" y="384" font-size="20" font-weight="400" fill="#172435" text-anchor="start">Selected independently held research / black-box demo</text><text x="114" y="415" font-size="20" font-weight="400" fill="#172435" text-anchor="start">Written confidentiality agreement, scope and recipients</text><text x="114" y="446" font-size="20" font-weight="400" fill="#172435" text-anchor="start">Separate disclosure authorization; no implied IP license</text><path d="M500 488 V520" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="520" y="508" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Separate transfer approval</text><rect x="90" y="522" width="820" height="196" rx="14" fill="#f0f3f7" stroke="#cbd5e1" stroke-width="2"/><rect x="108" y="541" width="6" height="30" rx="3" fill="#50667b"/><text x="126" y="565" font-size="25" font-weight="700" fill="#172435" text-anchor="start">INTERNAL · APPROVED ENVIRONMENT</text><path d="M108 582H892" stroke="#e2e8f0"/><text x="114" y="614" font-size="20" font-weight="400" fill="#172435" text-anchor="start">Authorized organizational knowledge and research</text><text x="114" y="645" font-size="20" font-weight="400" fill="#172435" text-anchor="start">Current and planned capabilities; contextualized findings</text><text x="114" y="676" font-size="20" font-weight="400" fill="#172435" text-anchor="start">Need-to-know evidence, IP and data controls</text><path d="M500 718 V750" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="90" y="752" width="820" height="80" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="784" font-size="23" font-weight="700" fill="#172435" text-anchor="middle">Governance decision input</text><text x="500" y="809" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Rights · audience · scope · security · explicit approval</text><path d="M500 832 V860" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="90" y="862" width="820" height="80" rx="14" fill="#eef2f7" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="894" font-size="23" font-weight="700" fill="#172435" text-anchor="middle">Converge with engineering alignment</text><text x="500" y="919" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Restricted disclosure is optional; internal access is not assumed</text><text x="500" y="987" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">NDA alone does not authorize system access, transfer, use or implementation</text></g></svg>